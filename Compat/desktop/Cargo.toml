[package]
name = "rclone-browser-next"
version = "0.9.2"
edition = "2021"
rust-version = "1.90"
authors = ["Jason Chen"]
description = "A dual-pane rclone browser for local folders, NAS and cloud storage"
license = "MIT"
repository = "https://github.com/jason840709/RcloneBrowserNext"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["image-png"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
