<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 112" width="560" height="112" role="img" aria-labelledby="title description">
  <title id="title">A dual-pane rclone app for Mac.</title>
  <desc id="description">Choose local folders, NAS or cloud storage on either side.</desc>
  <style>
    .card { fill: #f7f6f9; stroke: #9c8cad; }
    .lead { fill: #352c40; }
    .detail { fill: #62566f; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #252429; stroke: #93849f; }
      .lead { fill: #f0eaf7; }
      .detail { fill: #c6bcd2; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans CJK TC', sans-serif; text-anchor: middle; }
  </style>
  <rect class="card" x="1" y="1" width="558" height="110" rx="14" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text class="lead" x="280" y="47" font-size="22" font-weight="600">A dual-pane rclone app for Mac.</text>
  <text class="detail" x="280" y="80" font-size="19">Choose local folders, NAS or cloud storage on either side.</text>
</svg>
