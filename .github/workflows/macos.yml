name: macOS build and core tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RBN_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download a pinned rclone into this checkout
        run: /bin/bash Scripts/ci-rclone.sh
      - name: Build and verify the complete macOS app
        run: |
          /bin/bash Scripts/build-mac.sh --no-launch
          /bin/bash Scripts/verify-mac.sh
      - name: Run core tests with real rclone
        run: /bin/bash Scripts/test-mac.sh "$GITHUB_WORKSPACE/.build-cache/ci-engine/rclone"
      - name: Retain locally signed builds and checksums
        uses: actions/upload-artifact@v7
        with:
          name: RcloneBrowserNext-macOS-${{ matrix.arch }}
          path: |
            Distribution/*.zip
            Distribution/*.sha256
          if-no-files-found: error
          retention-days: 30

