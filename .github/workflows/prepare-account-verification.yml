name: Prepare portable account option decoding
on:
  push:
    branches: ['prepare/0.9.2-finalize']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9543e00b5e2159c74677bb18905ee95c0ef803f4
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse the verified cross-platform JSON boolean conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/Core/AccountConfiguration.swift');s=p.read_text(encoding='utf-8')
          old='CFGetTypeID(n) == CFBooleanGetTypeID()'
          assert s.count(old)==1 and s.count('\nimport CoreFoundation\n')==1
          s=s.replace(old,'EngineJSON.isBoolean(n)').replace('\nimport CoreFoundation\n','\n')
          p.write_text(s,encoding='utf-8')
          PY
          python3 Scripts/update-source-manifest.py
          python3 Scripts/verify-version.py
          git diff --check
      - name: Prepare application source objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True,encoding='utf-8').strip()
          assert git('rev-parse','HEAD')=='9543e00b5e2159c74677bb18905ee95c0ef803f4'
          names=git('diff','--name-only').splitlines()
          assert set(names)=={'Sources/Core/AccountConfiguration.swift','SOURCE_MANIFEST.json'}
          entries=[{'path':n,'mode':'100644','type':'blob','content':Path(n).read_text(encoding='utf-8')} for n in names]
          data=json.dumps({'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries},ensure_ascii=False)
          result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/jason840709/RcloneBrowserNext/git/trees','--input','-'],input=data,text=True,encoding='utf-8'))
          root=Path('.build-cache/verification-fix');root.mkdir(parents=True,exist_ok=True)
          receipt={'tree':result['sha'],'parent':git('rev-parse','HEAD'),'changedFiles':names,'published':False}
          (root/'result.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: RBN-0.9.2-portable-account-fix
          path: .build-cache/verification-fix/result.json
          if-no-files-found: error
