name: Publish verified Windows revision

on:
  push:
    branches: ['release/windows-v0.9.0-r1']

permissions:
  contents: read

concurrency:
  group: windows-release-0.9.0-r1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tested Windows installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reuse the successful Windows candidate and preserve the Mac release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/windows/publish-release.py
      - name: Retain publication and original-release receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-r1-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build-cache/windows-release/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
