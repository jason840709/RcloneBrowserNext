name: Prepare reviewed 0.9.1 source
on:
  push:
    branches: ['prepare/0.9.1']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the reviewed source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib,json,subprocess
          base='167be06a8ef7660e959d7c457c284b7c2626dd0d'
          text=''.join(Path('.prepare091/part'+str(i)).read_text().strip() for i in (1,2))
          assert hashlib.sha256(text.encode()).hexdigest()=='c3cbcfd3b5a45863b0ce7463a86c70f1698642bfcf4f585285985dc678b9850d'
          fixes=[[18919,18920,''],[18927,18929,''],[19041,19044,'d'],[19122,19123,''],[19124,19126,'6'],[23498,23648,'r+9up1Rtvr50/sXrmPIxq9dWbq5c+X719pXfrtxgtdub86mtnV/9caKh35pO1V6/f+/Y3q1+9gjW8fqd3+/Tq306uXT8PTay9f/LeV1/d++qd1Zff7V0407v0Xu+dy2uffrt2663V1z5fe+U3UNV']]
          for a,b,s in reversed(fixes): text=text[:a]+s+text[b:]
          assert hashlib.sha256(text.encode()).hexdigest()=='afdf968fa32ec6e575df5285ee1ff3a37da1233723222e2e6e7d0facd4f710a6'
          raw=zlib.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='4d2cf3938dd7bc6fce2491dd097d4e2c8c131c1e837b711cb06e00dc00e53848'
          delta=json.loads(raw)
          assert subprocess.check_output(['git','rev-parse',base+'^{tree}'],text=True).strip()==delta['baseTree']
          for item in delta['files']:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              old=p.read_bytes() if item['status']!='A' else b''
              if item['status']=='A': assert not p.exists()
              assert hashlib.sha256(old).hexdigest()==item['before'],str(p)
              result=old.decode('utf-8')
              for a,b,s in reversed(item['edits']): result=result[:a]+s+result[b:]
              new=result.encode('utf-8')
              assert hashlib.sha256(new).hexdigest()==item['after'],str(p)
              if item['status']=='D': p.unlink()
              else:
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          Path('.github/workflows/prepare-0.9.1.yml').unlink()
          for p in Path('.prepare091').iterdir(): p.unlink()
          Path('.prepare091').rmdir()
          PY
      - name: Build the checked-in UI
        working-directory: WebSource
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Retain complete reviewed source without writing to GitHub
        env:
          GIT_AUTHOR_NAME: Rclone Browser Next build
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: Rclone Browser Next build
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -A
          python3 Scripts/update-source-manifest.py
          git add SOURCE_MANIFEST.json
          git diff --cached --check
          python3 Scripts/verify-version.py
          mkdir -p .build-cache/prepared-source
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -p 167be06a8ef7660e959d7c457c284b7c2626dd0d -m 'Prepared unified 0.9.1 source')
          git update-ref refs/heads/prepared-source "$COMMIT"
          git bundle create .build-cache/prepared-source/prepared.bundle prepared-source --tags
          git archive --format=zip --output=.build-cache/prepared-source/source.zip "$COMMIT"
          printf '{"localCommit":"%s","tree":"%s","published":false}\n' "$COMMIT" "$TREE" > .build-cache/prepared-source/prepared.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: RcloneBrowserNext-Prepared-0.9.1
          path: .build-cache/prepared-source/
          include-hidden-files: true
          if-no-files-found: error
