name: Refresh reviewed source inventory
on:
  push:
    branches: ['prepare/0.9.1']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 30d5be65ba9bf997fabdcf8c07fe64a8c5c3d6e2
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh only the source inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/update-source-manifest.py
          python3 - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          base='30d5be65ba9bf997fabdcf8c07fe64a8c5c3d6e2'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==base
          assert git('diff','--name-only')=='SOURCE_MANIFEST.json'
          raw=Path('SOURCE_MANIFEST.json').read_text()
          data=json.loads(raw)
          assert data['version']=='0.9.1'
          assert data['files']['WebSource/tests/revision091.spec.ts']['sha256']=='9287bef834ae097f81a5e8a3b441fbf852e55074d73825ff602b1f48c8fbe263'
          payload=json.dumps({'base_tree':git('rev-parse','HEAD^{tree}'),'tree':[{'path':'SOURCE_MANIFEST.json','mode':'100644','type':'blob','content':raw}]})
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/jason840709/RcloneBrowserNext/git/trees','--input','-'],input=payload,text=True))
          Path('.build-cache/inventory').mkdir(parents=True,exist_ok=True)
          result={'sourceParent':base,'tree':tree['sha'],'manifestSHA256':hashlib.sha256(raw.encode()).hexdigest(),'onlyChange':'SOURCE_MANIFEST.json'}
          Path('.build-cache/inventory/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: RcloneBrowserNext-Inventory-0.9.1
          path: .build-cache/inventory/result.json
          if-no-files-found: error
